name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group ha --python 3.14
      - run: uv run --no-sync pytest -q --timeout=20
      - run: uv run --no-sync ruff check custom_components tests scripts
      - run: uv run --no-sync ruff format --check custom_components tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/package_light_masks.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
